name: Apply duplicate task save guard

on:
  push:
    branches:
      - agent/prevent-duplicate-task-saves
    paths:
      - .github/workflows/apply-duplicate-task-save-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prevent-duplicate-task-saves
      - name: Patch WordPress source
        run: python scripts/patch_duplicate_task_saves.py
      - name: Validate safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'let taskSaveInFlight = false' public/index.html
          grep -q 'saveButton.disabled = true' public/index.html
          grep -q 'uniquePayloads.map' public/index.html
          grep -q 'new Set(\[dateStr, ...extraDates\])' public/index.html
          grep -q 'taskSaveInFlight || saveButton?.disabled' public/index.html
          test "$(grep -c 'let taskSaveInFlight = false' public/index.html)" = "1"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          main=max(scripts,key=len)
          Path('/tmp/wrapsheet-inline.js').write_text(main)
          PY
          node --check /tmp/wrapsheet-inline.js
      - name: Commit patched frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prevent duplicate recurring task saves"
          git push origin HEAD:agent/prevent-duplicate-task-saves
