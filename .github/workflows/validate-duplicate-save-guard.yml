name: Validate duplicate task save guard

on:
  push:
    branches:
      - agent/prevent-duplicate-task-saves
    paths:
      - .github/workflows/validate-duplicate-save-guard.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prevent-duplicate-task-saves
      - name: Validate safeguards and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'let taskSaveInFlight = false' public/index.html
          grep -q 'saveButton.disabled = true' public/index.html
          grep -q 'uniquePayloads.map' public/index.html
          grep -Fq 'const allDates = [...new Set([dateStr, ...extraDates])];' public/index.html
          grep -Fq 'taskSaveInFlight || saveButton?.disabled' public/index.html
          test "$(grep -c 'let taskSaveInFlight = false' public/index.html)" = "1"
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          main=max(scripts,key=len)
          Path('/tmp/wrapsheet-inline.js').write_text(main)
          PY
          node --check /tmp/wrapsheet-inline.js
          mkdir -p audit
          printf '{"status":"passed","checks":["save-lock","enter-guard","series-payload-dedupe","inline-js-syntax"]}\n' > audit/frontend-duplicate-save-validation.json
      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/frontend-duplicate-save-validation.json
          git commit -m "Record duplicate-save guard validation"
          git push origin HEAD:agent/prevent-duplicate-task-saves
