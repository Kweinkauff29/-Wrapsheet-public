name: Capture duplicate-save patch result

on:
  push:
    branches:
      - agent/prevent-duplicate-task-saves
    paths:
      - .github/workflows/debug-duplicate-save-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prevent-duplicate-task-saves
      - name: Apply patch and capture result
        shell: bash
        run: |
          set +e
          mkdir -p audit
          python scripts/patch_duplicate_task_saves.py > audit/duplicate-save-patch.log 2>&1
          status=$?
          echo "exit_status=$status" >> audit/duplicate-save-patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html audit/duplicate-save-patch.log
          if ! git diff --cached --quiet; then
            git commit -m "Apply duplicate recurring task save guard"
            git push origin HEAD:agent/prevent-duplicate-task-saves
          fi
          exit 0
